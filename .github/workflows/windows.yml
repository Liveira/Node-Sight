# Compile and exercise the read-only Windows adapter without needing a private SSH host.
name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI needs repository read access only; deployment and publishing are separate actions.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Pin third-party action revisions so CI changes require an explicit review.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Compile Release
        run: cmake --build build --config Release --parallel
      - name: Run metric regressions
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage portable executables
        run: cmake --install build --config Release --prefix dist
      # Artifacts contain only executables, never personal configuration or SSH data.
      - name: Upload portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Node-Sight-windows-x64
          path: |
            dist/NodeSight.exe
            dist/node-sight-askpass.exe
          if-no-files-found: error
