; Safe schema-v2 example. Keep real destinations and private-key paths outside Git.
[widget]
server_count=2
selected=0
interval_ms=2000
opacity=94
size=100
detail=1
graphs=1
local=1
local_collapsed=0
pinned=0
cpu=1
ram=1
disk=1
network=1
sensors=1
swap=1

[recording]
; Disabled until explicitly enabled. Zero duration means continuous recording.
enabled=0
duration_minutes=60
every_ms=1000
max_mib=10
keep=5
cpu_threshold=80
ram_threshold=90
; Omit directory to use the default per-user Node-Sight logs folder.

[server0]
id=application
name=Application node
host=server.example.com
user=monitor
port=22
key=
enabled=1
visible=1
collapsed=0

[server1]
id=storage
name=Storage node
host=storage.example.com
user=monitor
port=22
key=
; This second example is intentionally disabled until configured.
enabled=0
visible=0
collapsed=1
